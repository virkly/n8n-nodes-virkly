# Publishes n8n-nodes-virkly to npm with a provenance statement when a `v*` tag is pushed.
# n8n only verifies community nodes published from GitHub Actions with provenance (since 2026-05-01).
#
# Two jobs: `verify` installs dev dependencies, lints, builds, tests, scans and packs the tarball with
# read-only permissions and no secrets. `publish` runs only on tags, installs nothing and publishes that
# tarball; it alone can mint the OIDC token, so no dependency code runs with publish rights.
#
# npm auth is trusted publishing (OIDC) only, configured on npmjs.com as
#   GitHub Actions · owner: virkly · repository: n8n-nodes-virkly · workflow: publish.yml · environment: (blank)
# with "Require 2FA and disallow tokens". No NPM_TOKEN exists. Trusted publishing only works on GitHub-hosted
# runners: keep `ubuntu-latest`.
#
# Release: bump "version" in package.json on main, then `git tag v<version> && git push origin v<version>`.
# Pull requests touching this file or package.json run `verify` with `npm publish --dry-run` on the tarball.

name: Publish

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Tag must match package.json version and be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint (n8n community-node rules)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: n8n community-package scanner
        run: npm run scan

      - name: Pack
        run: |
          mkdir -p pkg
          npm pack --pack-destination pkg
          ls -l pkg

      - name: Dry-run publish of the tarball
        run: npm publish ./pkg/*.tgz --access public --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # OIDC token for npm trusted publishing and the provenance attestation.
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11.6.2

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pkg

      # Publishing a tarball runs no package scripts, so no dependency code runs with publish rights.
      - name: Publish (trusted publishing, OIDC)
        run: npm publish ./pkg/*.tgz --provenance --access public
