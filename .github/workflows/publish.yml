# Publishes n8n-nodes-virkly to npm with a provenance statement when a `v*` tag is pushed.
# n8n only verifies community nodes published from GitHub Actions with provenance (since 2026-05-01).
#
# One-time npm setup (see VERIFICATION.md): add a trusted publisher on npmjs.com
#   GitHub Actions · owner: virkly · repository: n8n-nodes-virkly · workflow: publish.yml · environment: (blank)
# Fallback only if trusted publishing can't do the first publish: an NPM_TOKEN repo secret
# (granular token, read+write on this package). Delete it again once the trusted publisher works.
#
# Release: bump "version" in package.json on main, then `git tag v<version> && git push origin v<version>`.
# Pull requests that touch this file or package.json run the same job with `npm publish --dry-run`.

name: Publish

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # OIDC token for npm trusted publishing and the provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint (n8n community-node rules)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: n8n community-package scanner
        run: npm run scan

      - name: Publish
        env:
          # prepublishOnly (`n8n-node prerelease`) blocks any publish without RELEASE_MODE.
          RELEASE_MODE: 'true'
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
