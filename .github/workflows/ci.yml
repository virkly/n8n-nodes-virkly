name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (n8n community-node rules)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests (recorded fixtures, no network; also asserts no runtime dependencies)
        run: npm test

      - name: n8n community-package scanner
        run: npm run scan
